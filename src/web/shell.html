<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Smash &amp; Dash</title>
<style>
	html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
	main { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; gap: 12px; }
	canvas { background: #000; outline: none; max-width: 100vw; max-height: 90vh; image-rendering: pixelated; }
	#status { font-size: 14px; min-height: 1.2em; }
	button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
	/* The pad of the touch screens : it sends the keys of the keyboard to the game */
	#pad { display: none; position: fixed; inset: auto 0 0 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
		justify-content: space-between; align-items: flex-end; pointer-events: none; user-select: none; -webkit-user-select: none; }
	@media (pointer: coarse) { #pad { display: flex; } main { justify-content: flex-start; padding-top: 8px; box-sizing: border-box; } }
	#pad * { pointer-events: auto; touch-action: none; -webkit-touch-callout: none; }
	#dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.25); }
	#dpad span { position: absolute; width: 46px; height: 46px; border-radius: 10px; background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.7);
		display: flex; align-items: center; justify-content: center; font-size: 20px; pointer-events: none; }
	#dpad span.on { background: rgba(255, 255, 255, 0.45); }
	#dpad [data-key=w] { left: 52px; top: 4px; } #dpad [data-key=s] { left: 52px; bottom: 4px; }
	#dpad [data-key=a] { left: 4px; top: 52px; } #dpad [data-key=d] { right: 4px; top: 52px; }
	#buttons { display: grid; grid-template-columns: repeat(3, 54px); gap: 8px; }
	#buttons button { width: 54px; height: 54px; border-radius: 50%; padding: 0; font-size: 16px; font-weight: bold;
		background: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.8); border: 2px solid rgba(255, 255, 255, 0.3); }
	#buttons button.on { background: rgba(255, 255, 255, 0.45); }
	#buttons .skill { background: rgba(255, 170, 60, 0.25); }
</style>
</head>
<body>
<main>
	<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
	<div id="status">Chargement…</div>
	<button id="fullscreen" type="button">Plein écran</button>
</main>
<div id="pad">
	<div id="dpad"><span data-key="w">▲</span><span data-key="a">◀</span><span data-key="s">▼</span><span data-key="d">▶</span></div>
	<div id="buttons">
		<button class="skill" data-key="1">1</button><button class="skill" data-key="2">2</button><button data-key="Enter">A</button>
		<button class="skill" data-key="3">3</button><button class="skill" data-key="4">4</button><button data-key="Backspace">B</button>
		<button data-key="Shift" data-toggle style="grid-column: 3; font-size: 11px">Courir</button>
	</div>
</div>
<script>
	const status = document.getElementById("status");
	const canvas = document.getElementById("canvas");
	// The saves (Data/Saves) are kept by the browser (IndexedDB) : read before the game starts, written while it runs
	const SAVES = "/Data/Saves", STORED = "/stored", STORED_SAVES = "/stored/Saves";
	function copyTree(fs, from, to) {
		fs.mkdirTree(to);
		for (const name of fs.readdir(from)) {
			if (name === "." || name === "..") continue;
			const source = from + "/" + name, target = to + "/" + name;
			if (fs.isDir(fs.stat(source).mode)) copyTree(fs, source, target);
			else fs.writeFile(target, fs.readFile(source));
		}
	}
	function removeTree(fs, path) {
		for (const name of fs.readdir(path)) {
			if (name === "." || name === "..") continue;
			const child = path + "/" + name;
			if (fs.isDir(fs.stat(child).mode)) removeTree(fs, child);
			else fs.unlink(child);
		}
		fs.rmdir(path);
	}
	function storeSaves() {
		Module.FS.syncfs(false, (error) => { if (error) console.warn("The saves cannot be stored", error); });
	}
	var Module = {
		canvas: canvas,
		preRun: [() => {
			// The parameters of the page named SAD_... are the environment of the game (ex : ?SAD_BATTLE_PASSIVE=1)
			for (const [name, value] of new URLSearchParams(location.search)) {
				if (name.startsWith("SAD_")) Module.ENV[name] = value;
			}
			const fs = Module.FS;
			fs.mkdir(STORED);
			fs.mount(Module.IDBFS, {}, STORED);
			Module.addRunDependency("stored-saves");
			fs.syncfs(true, (error) => {
				if (error) console.warn("The stored saves cannot be read", error);
				Module.removeRunDependency("stored-saves");
			});
		}],
		onRuntimeInitialized: () => {
			// The first time, the saves of the game ; then the game reads and writes the stored ones
			const fs = Module.FS;
			if (!fs.analyzePath(STORED_SAVES).exists) {
				copyTree(fs, SAVES, STORED_SAVES);
				storeSaves();
			}
			removeTree(fs, SAVES);
			fs.symlink(STORED_SAVES, SAVES);
			setInterval(storeSaves, 5000);
			document.addEventListener("visibilitychange", () => { if (document.hidden) storeSaves(); });
			window.addEventListener("pagehide", storeSaves);
		},
		setStatus: (text) => { status.textContent = text; },
		monitorRunDependencies: (left) => { if (left === 0) { status.textContent = ""; canvas.focus(); } },
		print: (text) => console.log(text),
		printErr: (text) => console.warn(text),
	};
	// The keys go to the game when the page is clicked
	document.addEventListener("click", () => canvas.focus());
	// The whole page in full screen : the pad stays visible
	document.getElementById("fullscreen").addEventListener("click", () => document.documentElement.requestFullscreen());

	// The pad : each of its keys is sent to the game as a key of the keyboard (SDL reads its "code")
	const KEYS = {
		w: { key: "w", code: "KeyW" }, a: { key: "a", code: "KeyA" }, s: { key: "s", code: "KeyS" }, d: { key: "d", code: "KeyD" },
		1: { key: "1", code: "Digit1" }, 2: { key: "2", code: "Digit2" }, 3: { key: "3", code: "Digit3" }, 4: { key: "4", code: "Digit4" },
		Enter: { key: "Enter", code: "Enter" }, Backspace: { key: "Backspace", code: "Backspace" }, Shift: { key: "Shift", code: "ShiftLeft", location: 1 },
	};
	function sendKey(name, down) {
		window.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", Object.assign({ bubbles: true, cancelable: true }, KEYS[name])));
	}
	// The direction pad : the direction of the finger from its center (8 directions), the finger can slide
	const dpad = document.getElementById("dpad");
	const held = new Set();
	function steer(event) {
		const wanted = new Set();
		if (event) {
			const box = dpad.getBoundingClientRect();
			const x = event.clientX - (box.left + box.width / 2), y = event.clientY - (box.top + box.height / 2);
			if (Math.hypot(x, y) > box.width * 0.12) {
				const angle = Math.atan2(y, x), slice = Math.PI / 8;
				if (Math.abs(angle) < 3 * slice) wanted.add("d");
				if (Math.abs(angle) > 5 * slice) wanted.add("a");
				if (angle > slice && angle < 7 * slice) wanted.add("s");
				if (angle < -slice && angle > -7 * slice) wanted.add("w");
			}
		}
		for (const key of held) if (!wanted.has(key)) { held.delete(key); sendKey(key, false); }
		for (const key of wanted) if (!held.has(key)) { held.add(key); sendKey(key, true); }
		for (const arrow of dpad.children) arrow.classList.toggle("on", held.has(arrow.dataset.key));
	}
	let dpadPointer = null;
	dpad.addEventListener("pointerdown", (event) => { event.preventDefault(); dpadPointer = event.pointerId; dpad.setPointerCapture(event.pointerId); steer(event); });
	dpad.addEventListener("pointermove", (event) => { if (event.pointerId === dpadPointer) steer(event); });
	for (const type of ["pointerup", "pointercancel"]) {
		dpad.addEventListener(type, (event) => { if (event.pointerId === dpadPointer) { dpadPointer = null; steer(null); } });
	}
	// The buttons : pressed while the finger is on them ; "Courir" stays pressed until the next touch
	for (const button of document.querySelectorAll("#buttons button")) {
		const name = button.dataset.key, toggle = button.hasAttribute("data-toggle");
		const release = () => { if (button.classList.contains("on")) { button.classList.remove("on"); sendKey(name, false); } };
		button.addEventListener("pointerdown", (event) => {
			event.preventDefault();
			if (toggle && button.classList.contains("on")) { release(); return; }
			button.classList.add("on");
			sendKey(name, true);
		});
		if (!toggle) {
			for (const type of ["pointerup", "pointercancel", "pointerleave"]) button.addEventListener(type, release);
		}
		button.addEventListener("contextmenu", (event) => event.preventDefault());
	}
	dpad.addEventListener("contextmenu", (event) => event.preventDefault());
	window.addEventListener("error", (event) => { status.textContent = "Erreur : " + event.message; });
</script>
{{{ SCRIPT }}}
</body>
</html>
